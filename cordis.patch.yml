# Bundle patch layer for dsh-peak-price-panel: inserts the cost-panel row into the
# launcher composition (host half = lib/index.js, browser half = ./client).
# Values below are the composition `base` layer; the user can override every
# field live from Settings -> Plugins -> Cost panel.
- insert:
    - id: cost-panel
      name: 'dsh-peak-price-panel'
      config:
        warnThreshold: 50
        criticalThreshold: 20
        extremeThreshold: 5
        refreshSeconds: 60
        peakLeadSeconds: 1800
        currency: CNY
        apiKeyEnv: DEEPSEEK_API_KEY
        scheduleVersion: '2026-09-10'
        staleAfterDays: 30
        models: []
        prices:
          deepseek-flash:
            cacheHit: 0.04
            cacheMiss: 2.0
            output: 8.0
          deepseek-v4-pro:
            cacheHit: 0.30
            cacheMiss: 9.0
            output: 27.0
          deepseek-v4-flash:
            cacheHit: 0.04
            cacheMiss: 2.0
            output: 8.0
          deepseek-v4-flash-vision-exp:
            cacheHit: 0.04
            cacheMiss: 2.0
            output: 8.0
        peakWindows:
          - [9, 12]
          - [14, 18]
        # 中国法定节假日（北京时间 YYYY-MM-DD）：DeepSeek 按空闲时段全天计费。
        # 调休上班的周末由「周末=空闲」规则覆盖，无需列出。
        # 数据源：国务院办公厅关于2026年部分节假日安排的通知（国办发明电〔2025〕7号）。
        # 每年 11 月国务院公布次年安排后更新本列表（并同步 lib/pricing.js 的 DEFAULT_HOLIDAYS）。
        holidays:
          - '2026-01-01'
          - '2026-01-02'
          - '2026-01-03'
          - '2026-02-15'
          - '2026-02-16'
          - '2026-02-17'
          - '2026-02-18'
          - '2026-02-19'
          - '2026-02-20'
          - '2026-02-21'
          - '2026-02-22'
          - '2026-02-23'
          - '2026-04-04'
          - '2026-04-05'
          - '2026-04-06'
          - '2026-05-01'
          - '2026-05-02'
          - '2026-05-03'
          - '2026-05-04'
          - '2026-05-05'
          - '2026-06-19'
          - '2026-06-20'
          - '2026-06-21'
          - '2026-09-25'
          - '2026-09-26'
          - '2026-09-27'
          - '2026-10-01'
          - '2026-10-02'
          - '2026-10-03'
          - '2026-10-04'
          - '2026-10-05'
          - '2026-10-06'
          - '2026-10-07'
